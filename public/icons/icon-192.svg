<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1914" />
      <stop offset="100%" stop-color="#0e0d0b" />
    </radialGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2c98a" />
      <stop offset="50%" stop-color="#c4a35a" />
      <stop offset="100%" stop-color="#8f7335" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <rect width="184" height="184" x="4" y="4" rx="38" fill="none" stroke="url(#brassGrad)" stroke-width="2.5" opacity="0.7" />
  <rect width="172" height="172" x="10" y="10" rx="32" fill="none" stroke="#e4d8b4" stroke-width="1" opacity="0.15" />

  <!-- Grid dots pattern in background -->
  <circle cx="48" cy="48" r="1.5" fill="#c4a35a" opacity="0.3" />
  <circle cx="96" cy="48" r="1.5" fill="#c4a35a" opacity="0.3" />
  <circle cx="144" cy="48" r="1.5" fill="#c4a35a" opacity="0.3" />
  <circle cx="48" cy="96" r="1.5" fill="#c4a35a" opacity="0.3" />
  <circle cx="144" cy="96" r="1.5" fill="#c4a35a" opacity="0.3" />
  <circle cx="48" cy="144" r="1.5" fill="#c4a35a" opacity="0.3" />
  <circle cx="96" cy="144" r="1.5" fill="#c4a35a" opacity="0.3" />
  <circle cx="144" cy="144" r="1.5" fill="#c4a35a" opacity="0.3" />

  <!-- Network Interconnect Lines -->
  <path d="M96 42 L48 92 L96 142 L144 92 Z" fill="none" stroke="#c4a35a" stroke-width="2.5" opacity="0.4" stroke-dasharray="3 3" />
  <line x1="96" y1="42" x2="96" y2="142" stroke="url(#brassGrad)" stroke-width="2" opacity="0.6" />
  <line x1="48" y1="92" x2="144" y2="92" stroke="url(#brassGrad)" stroke-width="2" opacity="0.6" />

  <!-- Core Hub (Ra'anana City Hall) -->
  <circle cx="96" cy="92" r="22" fill="#161410" stroke="url(#brassGrad)" stroke-width="3" filter="url(#goldGlow)" />
  <!-- Municipal Tree / Shield Glyph inside core -->
  <path d="M96 79 L104 88 L101 88 L107 98 L98 98 L98 103 L94 103 L94 98 L85 98 L91 88 L88 88 Z" fill="url(#brassGrad)" />

  <!-- Network Satellite Nodes -->
  <!-- Top: Ahuza Fiber Ring -->
  <circle cx="96" cy="42" r="9" fill="#0e0d0b" stroke="#4ea89a" stroke-width="2.5" />
  <circle cx="96" cy="42" r="4" fill="#4ea89a" />

  <!-- Left: Moked 106 / VoIP -->
  <circle cx="48" cy="92" r="9" fill="#0e0d0b" stroke="#c4a35a" stroke-width="2.5" />
  <circle cx="48" cy="92" r="4" fill="#c4a35a" />

  <!-- Right: LPR Smart Cameras -->
  <circle cx="144" cy="92" r="9" fill="#0e0d0b" stroke="#3b82f6" stroke-width="2.5" />
  <circle cx="144" cy="92" r="4" fill="#3b82f6" />

  <!-- Bottom: Schools / Secondary Campuses -->
  <circle cx="96" cy="142" r="9" fill="#0e0d0b" stroke="#c4a35a" stroke-width="2.5" />
  <circle cx="96" cy="142" r="4" fill="#c4a35a" />

  <!-- Badge / Role marker -->
  <rect x="54" y="156" width="84" height="18" rx="5" fill="#1c1914" stroke="#c4a35a" stroke-width="1.2" />
  <text x="96" y="169" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#e2c98a" text-anchor="middle" letter-spacing="1">NETMAP PRO</text>
</svg>
