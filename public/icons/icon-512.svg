<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1914" />
      <stop offset="100%" stop-color="#0e0d0b" />
    </radialGradient>
    <linearGradient id="brassGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0ddaa" />
      <stop offset="50%" stop-color="#c4a35a" />
      <stop offset="100%" stop-color="#8f7335" />
    </linearGradient>
    <filter id="goldGlow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" />
  <rect width="492" height="492" x="10" y="10" rx="102" fill="none" stroke="url(#brassGrad512)" stroke-width="6" opacity="0.7" />
  <rect width="460" height="460" x="26" y="26" rx="86" fill="none" stroke="#e4d8b4" stroke-width="2" opacity="0.18" />

  <!-- Grid dots pattern -->
  <g opacity="0.3" fill="#c4a35a">
    <circle cx="128" cy="128" r="3" />
    <circle cx="256" cy="128" r="3" />
    <circle cx="384" cy="128" r="3" />
    <circle cx="128" cy="256" r="3" />
    <circle cx="384" cy="256" r="3" />
    <circle cx="128" cy="384" r="3" />
    <circle cx="256" cy="384" r="3" />
    <circle cx="384" cy="384" r="3" />
  </g>

  <!-- Network Interconnect Lines -->
  <path d="M256 112 L128 246 L256 380 L384 246 Z" fill="none" stroke="#c4a35a" stroke-width="6" opacity="0.35" stroke-dasharray="8 8" />
  <line x1="256" y1="112" x2="256" y2="380" stroke="url(#brassGrad512)" stroke-width="5" opacity="0.6" />
  <line x1="128" y1="246" x2="384" y2="246" stroke="url(#brassGrad512)" stroke-width="5" opacity="0.6" />

  <!-- Core Hub (Ra'anana City Hall) -->
  <circle cx="256" cy="246" r="58" fill="#161410" stroke="url(#brassGrad512)" stroke-width="7" filter="url(#goldGlow512)" />
  <!-- Municipal Tree / Shield Glyph inside core -->
  <path d="M256 210 L278 235 L270 235 L286 262 L262 262 L262 275 L250 275 L250 262 L226 262 L242 235 L234 235 Z" fill="url(#brassGrad512)" />

  <!-- Network Satellite Nodes -->
  <!-- Top: Ahuza Fiber Ring -->
  <circle cx="256" cy="112" r="24" fill="#0e0d0b" stroke="#4ea89a" stroke-width="6" />
  <circle cx="256" cy="112" r="10" fill="#4ea89a" />

  <!-- Left: Moked 106 / VoIP -->
  <circle cx="128" cy="246" r="24" fill="#0e0d0b" stroke="#c4a35a" stroke-width="6" />
  <circle cx="128" cy="246" r="10" fill="#c4a35a" />

  <!-- Right: LPR Smart Cameras -->
  <circle cx="384" cy="246" r="24" fill="#0e0d0b" stroke="#3b82f6" stroke-width="6" />
  <circle cx="384" cy="246" r="10" fill="#3b82f6" />

  <!-- Bottom: Schools / Secondary Campuses -->
  <circle cx="256" cy="380" r="24" fill="#0e0d0b" stroke="#c4a35a" stroke-width="6" />
  <circle cx="256" cy="380" r="10" fill="#c4a35a" />

  <!-- Badge / Role marker -->
  <rect x="146" y="420" width="220" height="46" rx="12" fill="#1c1914" stroke="#c4a35a" stroke-width="2.5" />
  <text x="256" y="451" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#f0ddaa" text-anchor="middle" letter-spacing="2">NETMAP PRO</text>
</svg>
